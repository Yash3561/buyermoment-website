<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183b32" />
    <meta
      name="description"
      content="AI search visibility, content, and implementation for businesses. ContextLumen tests buyer questions, improves approved pages, and documents what changes."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="ContextLumen | AI search visibility & website improvements"
    />
    <meta property="og:site_name" content="ContextLumen" />
    <meta property="og:url" content="https://www.contextlumen.com/" />
    <meta
      property="og:image"
      content="https://www.contextlumen.com/social-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ContextLumen: Help the right buyers find you in AI search."
    />
    <meta
      property="og:description"
      content="Your business. A better answer. AI search research, approved website improvements, and a clear record of what changed."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ContextLumen | AI search visibility & website improvements"
    />
    <meta
      name="twitter:description"
      content="Your business. A better answer. AI search research, content, and implementation."
    />
    <meta
      name="twitter:image"
      content="https://www.contextlumen.com/social-card.png"
    />
    <link rel="canonical" href="https://www.contextlumen.com/" />
    <script>
      (function () {
        var choice = "system";
        try {
          choice = localStorage.getItem("contextlumen-theme") || "system";
        } catch (_) {}
        var dark =
          choice === "dark" ||
          (choice !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>ContextLumen | AI search visibility & website improvements</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
