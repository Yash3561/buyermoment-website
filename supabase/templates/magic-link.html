<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body
    style="
      margin: 0;
      background: #f4f2ed;
      color: #17251f;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 520px;
              background: #fff;
              border: 1px solid #e1e5df;
              border-radius: 16px;
            "
          >
            <tr>
              <td style="padding: 32px">
                <p style="margin: 0 0 28px; font-size: 18px; font-weight: 700">
                  ContextLumen
                </p>
                <h1 style="margin: 0 0 16px; font-size: 26px; line-height: 1.2">
                  Your sign-in code
                </h1>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.6">
                  Enter this code in the ContextLumen audit page to sign in.
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    padding: 20px;
                    background: #f4f2ed;
                    border-radius: 8px;
                    font-size: 30px;
                    font-weight: 700;
                    letter-spacing: 5px;
                    text-align: center;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.6">
                  Use it only on www.contextlumen.com. Do not share this code
                  with anyone.
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    line-height: 1.6;
                    color: #58665f;
                  "
                >
                  If you did not request this email, you can ignore it.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
